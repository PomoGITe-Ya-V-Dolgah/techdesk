<form method="get" class="mobile-sort mobile-only">
  {% for key,value in filters.items %}{% if value %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}{% endfor %}
  <label for="mobile-sort" class="form-label">Сортировка</label>
  <div class="d-flex gap-2">
    <select name="sort" id="mobile-sort" class="form-select">
      {% for header in headers %}
        <option value="{{ header.key }}" {% if sort == header.key %}selected{% endif %}>{{ header.label }} ↑</option>
        {% with reverse='-'|add:header.key %}<option value="{{ reverse }}" {% if sort == reverse %}selected{% endif %}>{{ header.label }} ↓</option>{% endwith %}
      {% endfor %}
    </select>
    <button class="btn btn-outline-primary">Применить</button>
  </div>
</form>
